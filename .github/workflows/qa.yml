name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: 端到端回归
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: qa/package-lock.json

      - name: 安装测试依赖
        working-directory: qa
        run: npm ci

      - name: 定位 Chrome
        run: |
          set -euo pipefail
          for bin in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$bin" >/dev/null 2>&1; then
              echo "CHROME_PATH=$(command -v "$bin")" >> "$GITHUB_ENV"
              echo "使用 Chrome: $(command -v "$bin")"
              exit 0
            fi
          done
          echo "未找到 Chrome，尝试安装"
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-chrome-stable || sudo apt-get install -y -qq chromium-browser
          for bin in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$bin" >/dev/null 2>&1; then
              echo "CHROME_PATH=$(command -v "$bin")" >> "$GITHUB_ENV"
              echo "使用 Chrome: $(command -v "$bin")"
              exit 0
            fi
          done
          echo "::error::无法定位 Chrome 可执行文件"
          exit 1

      - name: 运行全量回归
        working-directory: qa
        run: node px-test.mjs

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: |
            qa/qa-result.json
            qa/shots/
          retention-days: 7
          if-no-files-found: ignore
